name: TokenPort upstream sync

on:
  workflow_dispatch:
  schedule:
    # Low-frequency check: approximately once every three days.
    - cron: '20 2 */3 * *'

concurrency:
  group: tokenport-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TokenPort product branch
        uses: actions/checkout@v4
        with:
          ref: tokenport/main
          fetch-depth: 0

      - name: Fetch Sub2API upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # merge=ours entries in .gitattributes need the driver defined, and
          # rerere keeps recorded conflict resolutions reusable within the job.
          git config merge.ours.driver true
          git config rerere.enabled true
          git config rerere.autoupdate true
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git || true
          git fetch upstream main
          git fetch origin main

      - name: Update upstream mirror branch
        shell: bash
        run: |
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse upstream/main)" ]; then
            echo "Fork main already matches Sub2API upstream."
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/main upstream/main; then
            echo "origin/main is not a fast-forward ancestor of upstream/main." >&2
            exit 1
          fi

          git push origin upstream/main:main

      - name: Merge upstream into a review branch
        id: merge
        shell: bash
        run: |
          upstream_sha="$(git rev-parse upstream/main)"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "TokenPort already contains upstream commit $upstream_sha."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="sync/upstream-${upstream_sha:0:12}"
          git switch -c "$branch"
          if ! git merge --no-edit upstream/main; then
            {
              echo "# TokenPort upstream synchronization conflict"
              echo
              echo "- Product branch: tokenport/main"
              echo "- Upstream commit: $upstream_sha"
              echo "- Review branch: $branch"
              echo
              echo "## Conflicted files"
              echo
              echo '```text'
              git diff --name-only --diff-filter=U
              echo '```'
            } > upstream-conflicts.md
            # Record the conflict marker FIRST: the report/summary steps are
            # gated on it, and the brief rendering below must not lose them.
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
            # Render a self-contained, harness-agnostic agent brief so the
            # conflict can be handed to any coding agent (Claude/Codex/Gemini).
            # Non-fatal: a rendering failure must never discard the report.
            if [ -f scripts/sync/upstream-conflict-agent-prompt.md ]; then
              BRANCH="$branch" UPSTREAM_SHA="$upstream_sha" python3 - > upstream-conflicts-agent-brief.md <<'PY' || echo "agent brief rendering failed (non-fatal)"
          import os, pathlib, subprocess, datetime
          tpl = pathlib.Path('scripts/sync/upstream-conflict-agent-prompt.md').read_text(encoding='utf-8')
          files = subprocess.run(['git', 'diff', '--name-only', '--diff-filter=U'],
                                 capture_output=True, text=True).stdout.strip()
          out = (tpl
                 .replace('{{DATE}}', datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC'))
                 .replace('{{REPO_PATH}}', '<你的 sub2api fork 本地路径（正斜杠）>')
                 .replace('{{TOKEN_PLATFORM_PATH}}', '<你的 token-platform 本地路径（正斜杠）>')
                 .replace('{{PRODUCT_BRANCH}}', 'tokenport/main')
                 .replace('{{UPSTREAM_REF}}', 'upstream/main')
                 .replace('{{UPSTREAM_REMOTE}}', 'upstream')
                 .replace('{{UPSTREAM_BRANCH}}', 'main')
                 .replace('{{UPSTREAM_SHA}}', os.environ['UPSTREAM_SHA'])
                 .replace('{{SYNC_BRANCH}}', os.environ['BRANCH'])
                 .replace('{{POLICY_PATH}}', 'scripts/sync/tokenport-sync-policy.json')
                 .replace('{{CONFLICTED_FILES}}', files)
                 .replace('{{RESOLVER_OUTPUT}}', '(GitHub Actions 路径不运行本地解决器；本地重建现场后请先执行简报第 4 步)'))
          print(out)
          PY
            fi
            exit 1
          fi
          echo "conflicted=false" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.merge.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        if: steps.merge.outputs.has_changes == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Validate TokenPort overlay
        if: steps.merge.outputs.has_changes == 'true'
        shell: pwsh
        run: ./scripts/check-tokenport-overlay.ps1

      - name: Test and build frontend
        if: steps.merge.outputs.has_changes == 'true'
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test:run
          pnpm build

      - name: Build runtime image
        if: steps.merge.outputs.has_changes == 'true'
        run: docker build -t tokenport-upstream-sync:${GITHUB_SHA} .

      - name: Push review branch
        if: steps.merge.outputs.has_changes == 'true'
        run: |
          git push --force-with-lease origin "${{ steps.merge.outputs.branch }}"

      - name: Open synchronization pull request
        if: steps.merge.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_url="$(gh pr list \
            --base tokenport/main \
            --head "${{ steps.merge.outputs.branch }}" \
            --state open \
            --json url \
            --jq '.[0].url // empty')"
          if [ -n "$existing_url" ]; then
            echo "Synchronization pull request already exists: $existing_url"
            exit 0
          fi

          gh pr create \
            --base tokenport/main \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "sync: merge latest Sub2API upstream" \
            --body "Automated upstream merge. TokenPort overlay checks, frontend tests, and image build completed before this PR was opened."

      - name: Upload conflict report
        if: failure() && steps.merge.outputs.conflicted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tokenport-upstream-conflicts
          path: |
            upstream-conflicts.md
            upstream-conflicts-agent-brief.md
          if-no-files-found: ignore

      - name: Publish conflict summary
        # 仓库已关闭 Issues，冲突只写入 Actions 摘要与 artifact，避免 createIssue 二次失败。
        if: failure() && steps.merge.outputs.conflicted == 'true'
        shell: bash
        run: |
          if [ -f upstream-conflicts.md ]; then
            {
              echo '## TokenPort upstream synchronization conflict'
              echo
              cat upstream-conflicts.md
              if [ -f upstream-conflicts-agent-brief.md ]; then
                echo
                echo '下载 artifact 中的 `upstream-conflicts-agent-brief.md`，填入本地路径后可直接交给任意编码代理（Claude Code / Codex / Gemini CLI）解决。'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'Conflict report appended to job summary. Artifact upload remains available for download.'
          else
            echo 'upstream-conflicts.md missing; merge conflict step did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
